<table>
  <thead>
    <tr>
      <th>Year</th>
      <th>Investment Value</th>
      <th>Interest (Year)</th>
      <th>Total Interest</th>
      <th>Invested Capital</th>
    </tr>
  </thead>
  <tbody>
    @for(investResult of outputt; track investResult)
    {
        <tr>
            <td>{{ investResult.year }}</td>
            <td>{{ investResult.valueEndOfYear }}</td>
            <td>{{ investResult.interest }}</td>
            <td>{{ investResult.totalAmountInvested }}</td>
            <td>{{ investResult.totalAmountInvested }}</td>
        </tr>
    }
  </tbody>
  <tfoot>
</table>
